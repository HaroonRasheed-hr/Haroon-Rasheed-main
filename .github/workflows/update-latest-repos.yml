name: Update Latest Repositories

on:
  schedule:
    # Runs every 6 hours. GitHub has no "on new repo created" trigger,
    # so this is the closest thing to "instant".
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update README with latest repos
        run: node .github/scripts/update-latest-repos.js
        env:
          GH_USERNAME: Zubair-hussain
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update latest repositories"
          git push
